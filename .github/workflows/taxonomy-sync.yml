+name: Review upstream taxonomy snapshot

on:
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fraud-watch-taxonomy-sync
  cancel-in-progress: false

jobs:
  prepare-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Fetch and validate pinned upstream snapshot
        run: node scripts/sync-taxonomy.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify pinned snapshot and run regression suites
        run: |
          node scripts/sync-taxonomy.js --verify
          node tests/taxonomy-sync.test.js
          node tests/candidate-lifecycle.test.js
          node tests/tick.test.js
          node tests/evolution.test.js
          node tests/evolution-runner.test.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Open a draft review pull request
        env:
          GH_TOKEN: ${{ secrets.TAXONOMY_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add a repo-scoped TAXONOMY_SYNC_TOKEN secret to permit draft PR creation. The repository GITHUB_TOKEN policy does not allow PR creation."
            exit 1
          fi

          git add data/fraud-data.json data/taxonomy-source.json
          if git diff --cached --quiet; then
            echo "The pinned upstream snapshot already matches this checkout."
            exit 0
          fi

          git config user.name "fraud-watch-taxonomy-sync"
          git config user.email "actions@users.noreply.github.com"
          TAXONOMY_COMMIT=$(node -p "require('./data/taxonomy-source.json').source_commit")
          TAXONOMY_VERSION=$(node -p "require('./data/taxonomy-source.json').taxonomy_version")
          BRANCH="automation/taxonomy-sync-$TAXONOMY_COMMIT"

          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            EXISTING_PR=$(gh pr list --state all --head "$BRANCH" --json url --jq '.[0].url // ""')
            if [ -n "$EXISTING_PR" ]; then
              echo "A review pull request already exists for this exact source commit: $EXISTING_PR"
              exit 0
            fi
            git fetch origin "$BRANCH"
            git switch --detach FETCH_HEAD
          else
            git switch --create "$BRANCH"
            git commit -m "Sync freight fraud taxonomy $TAXONOMY_VERSION"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

          cat > "$RUNNER_TEMP/taxonomy-pr.md" <<EOF
          ## Source and provenance
          - Repository: https://github.com/Jeevan-0508/freight-fraud-taxonomy
          - Source commit: $TAXONOMY_COMMIT
          - Source file: docs/data.json
          - Source SHA-256: $(node -p "require('./data/taxonomy-source.json').content_sha256")
          - Counts were checked against the upstream schema and index.

          This PR updates a static mirror only. It does not merge taxonomy changes or promote Fraud Watch simulation candidates. Review the upstream commit and the data diff before merging.

          Validation runs against the pinned source commit and the local regression suites before this PR is opened.
          EOF
          gh pr create --draft --base main --head "$BRANCH" \
            --title "Review freight fraud taxonomy $TAXONOMY_VERSION" \
            --body-file "$RUNNER_TEMP/taxonomy-pr.md"
