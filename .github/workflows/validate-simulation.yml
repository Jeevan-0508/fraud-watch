name: Validate Fraud Watch simulation

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/simulation/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/validate-simulation.yml'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'js/simulation/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/validate-simulation.yml'
      - 'README.md'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Run every repository test suite
        run: |
          set -euo pipefail
          for suite in tests/*.test.js; do
            echo "RUN $suite"
            node "$suite"
          done
