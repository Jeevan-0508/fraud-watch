+name: Validate taxonomy snapshot and candidate lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/fraud-data.json'
      - 'data/taxonomy-source.json'
      - 'scripts/sync-taxonomy.js'
      - 'tests/taxonomy-sync.test.js'
      - 'tests/candidate-lifecycle.test.js'
      - 'js/data.js'
      - 'js/simulation/candidateEngine.js'
      - 'js/ui/discovery-lab.js'
      - 'js/training.js'
      - 'index.html'
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verify snapshot against pinned upstream commit
        run: node scripts/sync-taxonomy.js --verify
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run taxonomy and candidate contract tests
        run: |
          node tests/taxonomy-sync.test.js
          node tests/candidate-lifecycle.test.js

      - name: Run simulation regression suites
        run: |
          node tests/tick.test.js
          node tests/evolution.test.js
          node tests/evolution-runner.test.js
